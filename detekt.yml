build:
  maxIssues: 15
  excludeCorrectable: false
  weights:
    complexity: 2
    LongParameterList: 1
    Style: 1

config:
  validation: true
  warningsAsErrors: false

complexity:
  ComplexCondition:
    active: true
    threshold: 4
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  LongMethod:
    active: true
    threshold: 70
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
  TooManyFunctions:
    active: true
    thresholdInFiles: 25

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true

style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2', '10', '100', '1000']
  UnusedImports:
    active: true
  WildcardImport:
    active: true
  NewLineAtEndOfFile:
    active: true
  EqualsNullCall:
    active: true
